name: Create tagged release
on:
  push:
    tags:
      - vcv4.5.*

jobs:
  prebuild-node:
    name: 'Build on Node v${{ matrix.node }} ${{ matrix.os.name }} ${{ matrix.arch }}'
    runs-on: ${{ matrix.os.name }}-${{ matrix.os.version }}

    strategy:
      matrix:
        os:
          - name: Ubuntu
            version: 22.04
          - name: macOS
            version: 14
          - name: Windows
            version: 2022
        node: ['18']
        arch: [x64]
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v6
      - name: Set up node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.arch }}
      - name: 'Add Windows apps'
        if: ${{ matrix.os.name == 'Windows' }}
        run: |
          choco install cmake -y
          choco upgrade cmake
      - name: 'Setup-msbuild'
        if: ${{ matrix.os.name == 'Windows' }}
        uses: microsoft/setup-msbuild@v2
      - name: 'Add Linux apps'
        if: ${{ matrix.os.name == 'Ubuntu' }}
        run: |
          sudo apt-get update
          sudo apt-get install libavcodec-dev libavformat-dev libswscale-dev libv4l-dev
          sudo apt-get install libxvidcore-dev libx264-dev
          sudo apt-get install cmake
      - name: 'Add macos apps'
        if: ${{ matrix.os.name == 'macos' }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: 'Install python'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Dependency install
        run: npm ci --unsafe-perm
      - name: Create opencvlib
        run: npm run create_opencvlib
      - name: 'Send Windows release to storage'
        if: ${{ matrix.os.name == 'Windows' }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: "osOpencvWorlds/win32/*.tgz"
          allowUpdates: true
      - name: 'Send macos release to storage'
        if: ${{ matrix.os.name == 'macos' }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: "osOpencvWorlds/darwin/*.tgz"
          allowUpdates: true
      - name: 'Send Ubuntu release to storage'
        if: ${{ matrix.os.name == 'Ubuntu' }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: "osOpencvWorlds/linux/*.tgz"
          allowUpdates: true
       
