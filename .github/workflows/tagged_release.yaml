name: Create tagged release
on:
  push:
    tags:
      - v4.6.*

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare GitHub release
    runs-on: ubuntu-22.04
    steps:
      - uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          skipIfReleaseExists: true
          prerelease: ${{ contains(github.ref_name, '-test.') }}

  prebuild-lib:
    needs: prepare-release
    name: "Build lib on Node v${{ matrix.node }} ${{ matrix.os.name }} ${{ matrix.os.arch }}"
    runs-on: ${{ matrix.os.name }}-${{ matrix.os.version }}

    strategy:
      matrix:
        os:
          - name: Ubuntu
            version: 22.04
            arch: x64
          - name: macOS
            version: 15-intel
            arch: x64
          - name: macOS
            version: 15
            arch: arm64
          - name: Windows
            version: 2022
            arch: x64
        node: ["18"]
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v6
      - name: Set up node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.os.arch }}
      - name: "Add Windows apps"
        if: ${{ matrix.os.name == 'Windows' }}
        run: |
          choco install cmake -y
          choco upgrade cmake
      - name: "Setup-msbuild"
        if: ${{ matrix.os.name == 'Windows' }}
        uses: microsoft/setup-msbuild@v3
      - name: "Add Linux apps"
        if: ${{ matrix.os.name == 'Ubuntu' }}
        run: |
          sudo apt-get update
          sudo apt-get install libavcodec-dev libavformat-dev libswscale-dev libv4l-dev
          sudo apt-get install libxvidcore-dev libx264-dev
          sudo apt-get install cmake
      - name: "Add macos apps"
        if: ${{ matrix.os.name == 'macos' }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: "Install python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Dependency install
        run: npm ci --unsafe-perm
      - name: Create opencvlib
        run: npm run create_opencvlib
      - name: "Send Windows release to storage"
        if: ${{ matrix.os.name == 'Windows' }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: "osOpencvWorlds/win32/*.tgz"
          allowUpdates: true
          prerelease: ${{ contains(github.ref_name, '-test.') }}
      - name: "Send macos release to storage"
        if: ${{ matrix.os.name == 'macos' }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: "osOpencvWorlds/${{ matrix.os.arch == 'arm64' && 'darwinM1' || 'darwin' }}/*.tgz"
          allowUpdates: true
          prerelease: ${{ contains(github.ref_name, '-test.') }}
      - name: "Send Ubuntu release to storage"
        if: ${{ matrix.os.name == 'Ubuntu' }}
        uses: ncipollo/release-action@v1
        with:
          artifacts: "osOpencvWorlds/linux/*.tgz"
          allowUpdates: true
          prerelease: ${{ contains(github.ref_name, '-test.') }}

  prebuild-node:
    needs:
      - prebuild-lib
    name: "Build on Node v${{ matrix.node }} ${{ matrix.os.name }} ${{ matrix.os.arch }}"
    runs-on: ${{ matrix.os.name }}-${{ matrix.os.version }}

    strategy:
      matrix:
        os:
          - name: Ubuntu
            version: 22.04
            arch: x64
          - name: macOS
            version: 15-intel
            arch: x64
          - name: macOS
            version: 15
            arch: arm64
          - name: Windows
            version: 2022
            arch: x64
        node: ["18", "20", "22", "23", "24", "25", "26"]
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v6
      - name: Set up node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.os.arch }}
      - name: "Install Linux dependencies"
        if: ${{ matrix.os.name == 'Ubuntu' }}
        run: |
          sudo apt-get update
          sudo apt-get install libavcodec-dev libavformat-dev libswscale-dev libv4l-dev
          sudo apt-get install libxvidcore-dev libx264-dev
          sudo apt-get install cmake
          sudo apt-get install -y build-essential
      - name: "Install python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: "Install Mac dependencies"
        if: ${{ matrix.os.name == 'macos' }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Install
        run: npm ci --unsafe-perm
      - name: Prebuild
        shell: bash
        run: npm run create_opencvnode_prebuild
      - name: Verify prebuild installation
        shell: bash
        run: npm run test:prebuild -- prebuilds/@stdmx/*.tar.gz
      - name: Install test dependencies
        working-directory: test
        run: npm ci --ignore-scripts
      - name: Verify test package resolution
        working-directory: test
        run: >-
          node -e "const fs = require('fs'); const path = require('path'); const actual = fs.realpathSync(require.resolve('@u4/opencv4nodejs')); const expected = fs.realpathSync(path.resolve('../lib/opencv4nodejs.js')); if (actual !== expected) throw new Error('Tests are not using the local package: ' + actual); const cv = require('@u4/opencv4nodejs'); if (!cv) throw new Error('Failed to load the freshly built addon'); console.log('Testing local addon:', actual, cv.version);"
      - name: Test fresh addon
        working-directory: test
        env:
          TEST_MODULE_LIST: core,highgui,calib3d,features2d,imgproc,io,xfeatures2d
          OPENCV4NODEJS_DISABLE_AUTOBUILD: 1
        run: npm test
      - name: Test external memory tracking
        working-directory: test
        env:
          OPENCV4NODEJS_DISABLE_AUTOBUILD: 1
        run: npm run test-externalMemTracking
      - uses: ncipollo/release-action@v1
        with:
          artifacts: "prebuilds/**/*.tar.gz"
          allowUpdates: true
          prerelease: ${{ contains(github.ref_name, '-test.') }}

  prebuild-electron-node18:
    needs:
      - prebuild-lib
    name: "Build on Node v${{ matrix.node }} ${{ matrix.os.name }} ${{ matrix.os.arch }} electron ${{ matrix.electron }}"
    runs-on: ${{ matrix.os.name }}-${{ matrix.os.version }}

    strategy:
      matrix:
        os:
          - name: Ubuntu
            version: 22.04
            arch: x64
          - name: macOS
            version: 15-intel
            arch: x64
          - name: macOS
            version: 15
            arch: arm64
          - name: Windows
            version: 2022
            arch: x64
        node: ["18"]
        runtime: [ electron ]
        electron: [ "23.0.0", "24.0.0", "25.0.0" ]
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v6
      - name: Set up node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.os.arch }}
      - name: "Install Linux dependencies"
        if: ${{ matrix.os.name == 'Ubuntu' }}
        run: |
          sudo apt-get update
          sudo apt-get install libudev-dev
      - name: "Install python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: "Install Mac dependencies"
        if: ${{ matrix.os.name == 'macos' }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Install
        run: npm ci --unsafe-perm
      - name: Prebuild
        shell: bash
        run: npm run create_opencvnode_prebuild -- -t ${{matrix.electron}} -r ${{matrix.runtime}}
      - uses: ncipollo/release-action@v1
        with:
          artifacts: "prebuilds/**/*.tar.gz"
          allowUpdates: true
          prerelease: ${{ contains(github.ref_name, '-test.') }}

  deploy:
    if: ${{ !contains(github.ref_name, '-test.') }}
    needs:
      - prebuild-node
      - prebuild-electron-node18
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v6
      - name: Set up node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Install
        run: npm ci --unsafe-perm
      - name: Publish tagged release to npm
        run: |
          npm run publish_package
